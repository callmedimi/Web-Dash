[vrf]
# Core router and Route Reflector for VRF and BGP routing diagnostics (Step 1.7)
# For local production override, use config.local.ini (ignored by Git)
router_name = CORE-ROUTER-01
router_ip = 192.0.2.1
rr_ip = 192.0.2.2

[site_arp]
# Comma-separated NE prefixes targeted by the ARP/MAC collector
target_ne_prefixes = NE,PE,AGG,CORE

[zabbix]
url = https://zabbix.example.com/api_jsonrpc.php
token = b8a512349f2c
verify_ssl = true
timeout = 120
max_retries = 3
retry_base_delay = 1.0
retryable_statuses = 429,500,502,503,504
